  <path d="M460,200 C520,180 560,220 740,310" fill="none" stroke="#6c757d" stroke-width="2.5"/>
  <path d="M460,55 C500,60 600,80 740,200" fill="none" stroke="#e63946" stroke-width="2.5"/>
  <text x="470" y="70" class="t" style="fill:#6c757d">Tabular AP=0.300</text>
  <text x="470" y="88" class="t" style="fill:#e63946">Graph AP=0.918</text>
  <text x="600" y="355" text-anchor="middle" class="t">Recall</text>
</svg>
